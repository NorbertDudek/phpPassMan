name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=stderr > /dev/null

  secrets:
    name: No local config committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that resources/config.php is not in the repository
        run: |
          if git ls-files --error-unmatch resources/config.php >/dev/null 2>&1; then
            echo "::error file=resources/config.php::resources/config.php contains credentials and must not be committed"
            exit 1
          fi
